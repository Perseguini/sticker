<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Pixar 3D com IA</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal-js@2.1.1/dist/index.iife.min.js"></script>
    <script>
        const VERSAO = "6.0";
        if(!localStorage.getItem('versao') || localStorage.getItem('versao') !== VERSAO){
            localStorage.setItem('versao', VERSAO);
            window.addEventListener('load', ()=>{
                setTimeout(()=>alert(`✅ Versão ${VERSAO}\n- IA gera estilo Pixar 3D 🎬\n- Fidelidade facial\n- Borda branca fina + balão\n- Fundo transparente`), 400);
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="versao">v6.0</div>
        <h1>✨ Sticker Pixar 3D com IA ✨</h1>

        <!-- Upload -->
        <div class="upload-box">
            <label for="foto-input" class="upload-label">
                📷 Envie sua foto
            </label>
            <input type="file" id="foto-input" accept="image/*">
            <div id="processando" class="processando-oculto">
                <div class="spinner"></div>
                <p id="status-texto">Transformando em Pixar 3D... ⏳</p>
            </div>
        </div>

        <!-- Texto do balão -->
        <div class="texto-balao-box">
            <h3>💬 Texto do balão de fala</h3>
            <input 
                type="text" 
                id="texto-balao" 
                placeholder="Ex: Olá! Eu cheguei!"
                maxlength="30">
            <button id="gerar-btn" class="gerar-btn">🚀 Gerar Sticker Pixar</button>
        </div>

        <!-- Preview -->
        <div class="preview">
            <h3>👀 Pré-visualização (512×512)</h3>
            <div class="canvas-wrapper">
                <canvas id="sticker" width="512" height="512"></canvas>
            </div>
        </div>

        <button id="baixar" class="btn-baixar">⬇️ Baixar Sticker PNG</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
