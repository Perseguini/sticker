<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Sticker WhatsApp</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal-js@2.1.1/dist/index.iife.min.js"></script>
    <script>
        const VERSAO = "4.0";
        if(!localStorage.getItem('versao') || localStorage.getItem('versao') !== VERSAO){
            localStorage.setItem('versao', VERSAO);
            window.addEventListener('load', ()=>{
                setTimeout(()=>alert(`✅ Versão ${VERSAO}\n- Foto vira sticker automaticamente\n- Recorte e máscara corrigidos\n- Fundo transparente real`), 400);
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="versao">v4.0</div>
        <h1>✨ Criador de Sticker ✨</h1>

        <!-- Upload -->
        <div class="upload-box">
            <label for="foto-input" class="upload-label">
                📷 Clique para enviar sua foto
            </label>
            <input type="file" id="foto-input" accept="image/*">
            <div id="processando" class="processando-oculto">
                <div class="spinner"></div>
                <p>Processando... ⏳</p>
            </div>
        </div>

        <!-- Pedido -->
        <div class="comando-box">
            <h3>📝 Seu pedido</h3>
            <textarea id="pedido" placeholder="Exemplo:
- Contorno branco grosso, sem fundo, circular
- Sem borda, fundo transparente, formato arredondado"></textarea>
            <button id="aplicar-btn" class="aplicar-btn">✅ Aplicar e Gerar</button>
        </div>

        <!-- Configurações -->
        <div class="config">
            <h3>🎨 Ajustes</h3>

            <div class="linha">
                <label>Cor do contorno:</label>
                <input type="color" id="cor-borda" value="#ffffff">
            </div>

            <div class="linha">
                <label>Espessura da borda:</label>
                <input type="range" id="espessura" min="0" max="24" value="8">
                <span id="val-espessura">8</span>
            </div>

            <div class="linha">
                <label>Fundo transparente:</label>
                <input type="checkbox" id="transparente" checked>
            </div>

            <div class="linha">
                <label>Formato:</label>
                <select id="formato">
                    <option value="circulo">⭕ Círculo</option>
                    <option value="arredondado" selected>🟦 Arredondado</option>
                    <option value="quadrado">⬜ Quadrado</option>
                </select>
            </div>

            <div class="linha">
                <label>Texto abaixo:</label>
                <input type="text" id="texto" placeholder="Seu texto...">
            </div>

            <div class="linha">
                <button id="remover-fundo" class="btn-perigo">🗑️ Remover Fundo da Foto</button>
            </div>
        </div>

        <!-- Preview -->
        <div class="preview">
            <h3>👀 Pré-visualização (512×512)</h3>
            <div class="canvas-wrapper">
                <canvas id="sticker" width="512" height="512"></canvas>
            </div>
        </div>

        <button id="baixar" class="btn-baixar">⬇️ Baixar Sticker PNG</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
